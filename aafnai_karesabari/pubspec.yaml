name: hamro_karesabari
description: A local marketplace connecting Nepali farmers directly with buyers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  cached_network_image: ^3.4.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.5.1
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
